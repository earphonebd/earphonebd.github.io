<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081426"><title>Earphone BD Employee Dashboard</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="partner.css"></head>
<body><header class="portal-header"><div class="portal-header-inner"><a class="portal-brand" href="index.html"><span class="portal-mark">E</span><span><strong>Earphone BD</strong><small>EMPLOYEE PANEL</small></span></a><div class="header-links"><a href="index.html">স্টোর</a><button id="logoutButton">লগআউট</button></div></div></header>
<main class="portal-main"><section class="portal-dashboard hidden" id="employeeDashboard"><article class="welcome"><span class="eyebrow">Authorized Employee</span><h1><span id="employeeName">কর্মী</span>, স্বাগতম</h1><p id="roleDescription">আপনার নির্ধারিত কাজ ও অনুমতি এখানে দেখা যাবে।</p><div class="welcome-meta"><span id="employeeIdLabel"></span><span id="employeeRoleLabel"></span><span>Account সক্রিয়</span></div></article><div class="metric-grid"><article class="metric"><span>মোট অর্ডার</span><strong id="metricOrders">০</strong></article><article class="metric"><span>Pending</span><strong id="metricPending">০</strong></article><article class="metric"><span>Processing</span><strong id="metricProcessing">০</strong></article><article class="metric"><span>Delivered</span><strong id="metricDelivered">০</strong></article></div><section class="panel active"><div class="panel-heading"><div><span class="eyebrow">Order workspace</span><h2 id="workspaceTitle">অর্ডার তালিকা</h2><p id="workspaceHint">কাস্টমারের অর্ডার ও ডেলিভারি অবস্থা দেখুন।</p></div><input class="mini-select" id="employeeOrderSearch" type="search" placeholder="অর্ডার, নাম বা ফোন"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>অর্ডার</th><th>কাস্টমার</th><th>ঠিকানা</th><th>মোট</th><th>স্ট্যাটাস</th><th id="actionHeading">Action</th></tr></thead><tbody id="employeeOrdersBody"></tbody></table></div></section></section></main><div class="toast-wrap" id="toastWrap"></div><script src="store-data.js"></script><script src="employee-dashboard.js"></script></body></html>
