<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Now | Earphone BD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Header -->
  <header>
    <div class="container header-content" style="justify-content: center;">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Earphone BD Logo" class="logo-img">
        Earphone<span>BD</span>
      </a>
    </div>
  </header>

  <!-- Order Section -->
  <section class="section container" style="margin-top: 60px; padding-bottom: 120px;">
    <div class="checkout-header">
      <h1>Checkout</h1>
    </div>

    <div class="order-layout">
      <!-- Order Review (Reference Style) -->
      <div class="order-review-section">
        <h2 class="section-title-accent">Order review</h2>
        <div id="order-items-container" class="order-review-container">
          <!-- Dynamic Items will be injected here by script.js -->
        </div>

        <!-- Address Section -->
        <div class="address-section">
          <h2 class="section-title-accent">Shipping Address</h2>
          <form id="orderForm">
            <div class="form-group">
              <label>Full Name (পুরো নাম)</label>
              <input type="text" id="name" placeholder="আপনার পুরো নাম লিখুন" minlength="3" pattern="^[a-zA-Z\s\u0980-\u09FF]{3,50}$" title="অনুগ্রহ করে আপনার সঠিক নাম লিখুন (কমপক্ষে ৩ অক্ষর)" required>
            </div>
            <div class="form-group">
              <label>Phone Number (মোবাইল নাম্বার)</label>
              <input type="tel" id="phone" placeholder="যেমন: 017XXXXXXXX" pattern="^01[3-9]\d{8}$" maxlength="11" title="১১ ডিজিটের সঠিক মোবাইল নাম্বার দিন (যেমন: 01712345678)" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>জেলা (District)</label>
                <select id="district-select" required>
                  <option value="" disabled selected>জেলা নির্বাচন করুন</option>
                </select>
              </div>
              <div class="form-group">
                <label>উপজেলা (Thana)</label>
                <select id="thana-select" required>
                  <option value="" disabled selected>উপজেলা নির্বাচন করুন</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label>বিস্তারিত ঠিকানা (মডেল/বিল্ডিং/এলাকা)</label>
              <input type="text" id="address" placeholder="আপনার বিস্তারিত ঠিকানা লিখুন" required>
            </div>
            
            <div class="form-group">
              <label>অর্ডার নোট (অপশনাল)</label>
              <input type="text" id="order-note" placeholder="কোনো মন্তব্য থাকলে লিখুন">
            </div>

            <div class="delivery-options-hidden" style="display: none;">
              <!-- Hidden but used for logic -->
              <div class="delivery-option" id="ship-inside" onclick="updateShipping('inside')"></div>
              <div class="delivery-option" id="ship-outside" onclick="updateShipping('outside')"></div>
            </div>
          </form>
        </div>
      </div>

      <!-- Price Summary (Right Sidebar) -->
      <div class="order-sidebar">
        <div class="summary-card">
          <h3 style="margin-bottom: 20px; font-weight: 800;">Order Summary</h3>
          <div class="summary-row">
            <span>Sub-Total</span>
            <strong id="summary-subtotal">৳0</strong>
          </div>
          <div class="summary-row">
            <span id="shipping-label">Shipping</span>
            <strong id="summary-shipping">৳29</strong>
          </div>
          <div class="summary-total summary-row">
            <span>Total Amount</span>
            <span id="summary-total">৳0</span>
          </div>
          
          <!-- Desktop Version of Button -->
          <button type="submit" form="orderForm" class="btn-confirm-order hide-mobile">
            অর্ডার কনফার্ম করুন
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Sticky Mobile Bottom Bar -->
  <div class="sticky-mobile-order show-mobile">
    <div class="sticky-total-info">
      <span>Total: <strong id="mobile-sticky-total">৳0</strong></span>
    </div>
    <button type="submit" form="orderForm" class="btn-confirm-order">
      অর্ডার কনফার্ম করুন
    </button>
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; <a href="admin.html" style="color: inherit; text-decoration: none; cursor: pointer;">2026</a> Earphone BD. All rights reserved.</p>
    </div>
  </footer>

  <!-- Floating Messenger CTA -->
  <a href="https://m.me/bdearphone" class="floating-cta" target="_blank" aria-label="Message on Facebook">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 0C3.58 0 0 3.34 0 7.46c0 2.34 1.18 4.41 3.02 5.75V16l2.75-1.5c.7.2 1.45.31 2.23.31 4.42 0 8-3.34 8-7.46S12.42 0 8 0zm1.37 10.36L6.96 7.9 2.8 10.36l4.52-4.8 2.41 2.46 4.16-2.46-4.52 4.8z" />
    </svg>
  </a>

  <!-- Firebase & Order Logic -->
  <script>
    window.orderItems = [];
  </script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    
    const firebaseConfig = {
      apiKey: "AIzaSyAdE8jMo0ZNqkK-JSERuY88i0cxAOlkA3w",
      authDomain: "earphone-bd.firebaseapp.com",
      projectId: "earphone-bd",
      storageBucket: "earphone-bd.firebasestorage.app",
      messagingSenderId: "561559779888",
      appId: "1:561559779888:web:e135f613c914ad4ac4cbf5",
      measurementId: "G-C5CG6HCKWG",
      databaseURL: "https://earphone-bd-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Helper to get form input values
    const getValue = (id) => {
      const el = document.getElementById(id);
      return el ? (el.value || el.innerText || "").trim() : "";
    };

    // Initialize Order Handling
    const initOrder = () => {
      const orderForm = document.getElementById('orderForm');
      if (!orderForm) {
        console.error("Order form not found!");
        return;
      }

      // Pre-populate name if logged in via Google
      try {
        const currentUserObj = JSON.parse(localStorage.getItem('earphone_bd_user') || 'null');
        if (currentUserObj && currentUserObj.name) {
          const nameInput = document.getElementById('name');
          if (nameInput) nameInput.value = currentUserObj.name;
        }
      } catch (err) {
        console.error("Error pre-populating name:", err);
      }

      // Firebase Auth Observer to check if user signs in during checkout
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const userData = {
            name: user.displayName,
            email: user.email,
            phone: user.phoneNumber || "",
            photo: user.photoURL
          };
          localStorage.setItem('earphone_bd_user', JSON.stringify(userData));
          
          // Auto pre-populate name field if not filled
          const nameInput = document.getElementById('name');
          if (nameInput && !nameInput.value) {
            nameInput.value = user.displayName;
          }

          // Check for pending order and confirm it automatically!
          const pendingOrderStr = localStorage.getItem('pending_checkout_order');
          if (pendingOrderStr) {
            console.log("Found pending checkout order. Automating submission...");
            localStorage.removeItem('pending_checkout_order');
            await handleConfirmOrder();
          }
        } else {
          localStorage.removeItem('earphone_bd_user');
        }
      });

      // Unified order confirmation submission logic
      const handleConfirmOrder = async () => {
        const submitBtns = document.querySelectorAll('.btn-confirm-order');
        if (submitBtns.length === 0) return;
        const originalBtnText = submitBtns[0].innerHTML;
        
        submitBtns.forEach(btn => {
          btn.innerText = 'অর্ডার প্রসেসিং হচ্ছে...';
          btn.disabled = true;
        });

        try {
          const currentUserObj = JSON.parse(localStorage.getItem('earphone_bd_user') || 'null');

          // Compile items info for backward compatibility with admin panel
          const itemsList = window.orderItems || [];
          const productSummary = itemsList.map(item => `${item.title} (${item.qty} Pcs)`).join(', ');
          const totalQty = itemsList.reduce((sum, item) => sum + item.qty, 0);
          const subtotalText = getValue('summary-subtotal');
          const price = parseInt(subtotalText.replace(/[^\d]/g, '')) || 0;
          
          let variation = "Not Specified";
          let color = "Not Specified";

          // Version & Color Logic based on items info
          const itemsStr = itemsList.map(i => `${i.title} ${i.edition || ''} ${i.color || ''}`).join(' ').toLowerCase();
          
          if (itemsList.length === 1 && itemsList[0].edition) {
            variation = itemsList[0].edition;
          } else if (price >= 500 || itemsStr.includes('dubai') || itemsStr.includes('anc')) {
            variation = "Dubai Edition";
          } else {
            variation = "China Edition";
          }

          if (itemsList.length === 1 && itemsList[0].color) {
            color = itemsList[0].color;
          } else if (itemsStr.includes('black')) {
            color = "Black";
          } else if (itemsStr.includes('white')) {
            color = "White";
          }

          const orderData = {
            customer: {
              name: getValue('name'),
              phone: getValue('phone'),
              address: getValue('address'),
              note: getValue('order-note'),
              email: currentUserObj ? currentUserObj.email : ""
            },
            order: {
              items: itemsList,
              product: productSummary || "Not Specified",
              quantity: totalQty || 1,
              variation: variation,
              color: color,
              shipping_area: (getValue('district-select') === 'Dhaka' || getValue('district-select') === 'ঢাকা') ? 'Inside Dhaka' : 'Outside Dhaka',
              district: getValue('district-select'),
              thana: getValue('thana-select'),
              subtotal: getValue('summary-subtotal'),
              shipping_cost: getValue('summary-shipping'),
              total_price: getValue('summary-total')
            },
            metadata: {
              date: new Date().toLocaleString('bn-BD'),
              timestamp: Date.now(),
              status: 'New Order'
            }
          };

          const ordersRef = ref(db, 'orders');
          await set(push(ordersRef), orderData);

          // Clear local storage cart upon successful checkout
          localStorage.removeItem('earphone_bd_cart');

          // Show Premium Success Modal
          const modal = document.getElementById('success-modal');
          if (modal) {
            modal.style.display = 'flex';
          }

          // Redirect after 3 seconds
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 3000);

        } catch (error) {
          console.error("Firebase Error:", error);
          alert('Error: ' + error.message);
          submitBtns.forEach(btn => {
            btn.innerHTML = originalBtnText;
            btn.disabled = false;
          });
        }
      };

      // Form Submit Handler
      orderForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        console.log("Submit button clicked, validating input...");

        const name = getValue('name');
        const phone = getValue('phone');
        const address = getValue('address');

        if (!name || !phone || !address) {
          alert('দয়া করে আপনার নাম, মোবাইল নাম্বার এবং সম্পূর্ণ ঠিকানা সঠিকভাবে পূরণ করুন।');
          return;
        }

        // Validate Bangladeshi Mobile Number Pattern
        const phoneRegex = /^01[3-9]\d{8}$/;
        if (!phoneRegex.test(phone)) {
          alert('দয়া করে সঠিক ১১-ডিজিটের বাংলাদেশী মোবাইল নাম্বার দিন (যেমন: 017XXXXXXXX)।');
          return;
        }

        const currentUserObj = JSON.parse(localStorage.getItem('earphone_bd_user') || 'null');

        if (!currentUserObj) {
          // Store order details in localStorage temporarily to continue after login
          const pendingOrder = {
            name: name,
            phone: phone,
            address: address,
            note: getValue('order-note'),
            district: getValue('district-select'),
            thana: getValue('thana-select')
          };
          localStorage.setItem('pending_checkout_order', JSON.stringify(pendingOrder));

          try {
            // Trigger beautiful popup sign-in
            console.log("Triggering Google Popup Auth during checkout...");
            await signInWithPopup(auth, provider);
            // Once popup completes, onAuthStateChanged observer will trigger automatic confirmation!
          } catch (popupErr) {
            console.error("Google Auth failed inside Checkout form:", popupErr);
            alert("অর্ডার সম্পূর্ণ করতে গুগল লগইন করা আবশ্যক। দয়া করে আবার চেষ্টা করুন।");
            localStorage.removeItem('pending_checkout_order');
          }
          return;
        }

        // If already logged in, proceed directly!
        await handleConfirmOrder();
      });
    };

    // Run once
    initOrder();
  </script>

  <!-- Success Modal -->
  <div id="success-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: white; padding: 40px; border-radius: 30px; text-align: center; max-width: 400px; width: 90%; transform: scale(0.9); animation: modalIn 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);">
      <div style="width: 80px; height: 80px; background: #eff6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 25px; color: #2563eb;">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <h2 style="font-size: 1.8rem; font-weight: 900; margin-bottom: 10px; color: #1e293b;">ধন্যবাদ!</h2>
      <p style="color: #64748b; font-size: 1.1rem; line-height: 1.5;">আপনার অর্ডারটি সফলভাবে সম্পন্ন হয়েছে। আমাদের প্রতিনিধি শীঘ্রই আপনার সাথে যোগাযোগ করবেন।</p>
      <div style="margin-top: 30px; height: 4px; background: #f1f5f9; border-radius: 2px; overflow: hidden;">
        <div style="height: 100%; background: #2563eb; width: 100%; animation: progress 3s linear;"></div>
      </div>
    </div>
  </div>

  <style>
    @keyframes modalIn { to { transform: scale(1); opacity: 1; } }
    @keyframes progress { from { width: 100%; } to { width: 0%; } }
  </style>

  <script src="script.js" defer></script>
</body>

</html>
