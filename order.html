<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Now | Earphone BD</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Header -->
  <header>
    <div class="container header-content" style="justify-content: center;">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="Earphone BD Logo" class="logo-img">
        Earphone<span>BD</span>
      </a>
    </div>
  </header>

  <!-- Order Section -->
  <section class="section container" style="margin-top: 80px;">
    <div class="order-layout">
      <!-- Order Form (Left) -->
      <div class="order-form-container">
        <h2 style="margin-bottom: 25px; font-size: 1.5rem; font-weight: 800;">অর্ডার করতে নিচের ফর্মটি পূরণ করুন</h2>
        <form id="orderForm">
          <div class="order-input-group">
            <div class="order-input-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <input type="text" class="order-input-field" placeholder="আপনার পুরো নাম লিখুন" required>
          </div>

          <div class="order-input-group">
            <div class="order-input-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            </div>
            <input type="tel" class="order-input-field" placeholder="আপনার মোবাইল নাম্বার লিখুন" required>
          </div>

          <div class="order-input-group">
            <div class="order-input-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <input type="text" class="order-input-field" placeholder="আপনার বিস্তারিত ঠিকানা লিখুন" required>
          </div>

          <div class="order-input-group">
            <div class="order-input-icon">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2v10z"/></svg>
            </div>
            <input type="text" class="order-input-field" placeholder="কোনো মন্তব্য থাকলে লিখুন (অপশনাল)">
          </div>

          <h3 style="margin: 25px 0 15px; font-size: 1.2rem; font-weight: 800;">এলাকা নির্বাচন করুন</h3>
          <div class="shipping-options">
            <div class="shipping-option selected" onclick="updateShipping('inside')">
              <div class="shipping-info">
                <div class="radio-circle"></div>
                <span>Inside Dhaka City Rate</span>
              </div>
              <strong>৳70</strong>
            </div>
            <div class="shipping-option" onclick="updateShipping('outside')">
              <div class="shipping-info">
                <div class="radio-circle"></div>
                <span>Outside Dhaka City Rate</span>
              </div>
              <strong>৳130</strong>
            </div>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px; padding: 18px; font-size: 1.2rem;">
            অর্ডার কনফার্ম করুন (<span id="btn-total">৳0</span>)
          </button>
        </form>
      </div>

      <!-- Order Summary (Right) -->
      <div class="order-summary">
        <h3 style="margin-bottom: 20px; font-size: 1.3rem; font-weight: 800; text-align: center;">আপনার অর্ডার</h3>
        <div id="cart-content">
          <div class="cart-item">
            <img src="" alt="Product" class="cart-item-img" id="summary-img">
            <div class="cart-item-details">
              <h4 id="summary-title" style="margin-bottom: 5px;">Product Title</h4>
              <p style="color: var(--text-secondary); font-size: 0.9rem;" id="summary-price">৳0</p>
              <div class="quantity-selector">
                <div class="qty-btn" onclick="updateQty(-1)">-</div>
                <span id="summary-qty" style="font-weight: 800;">1</span>
                <div class="qty-btn" onclick="updateQty(1)">+</div>
              </div>
            </div>
          </div>
          
          <div style="margin-top: 20px;">
            <div class="summary-row">
              <span>Sub-Total</span>
              <strong id="summary-subtotal">৳0</strong>
            </div>
            <div class="summary-row">
              <span id="shipping-label">Inside Dhaka City</span>
              <strong id="summary-shipping">৳70</strong>
            </div>
            <div class="summary-total summary-row">
              <span>Total</span>
              <span id="summary-total">৳0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; 2026 Earphone BD. All rights reserved.</p>
    </div>
  </footer>

  <!-- Floating Messenger CTA -->
  <a href="https://m.me/bdearphone" class="floating-cta" target="_blank" aria-label="Message on Facebook">
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" viewBox="0 0 16 16">
      <path d="M8 0C3.58 0 0 3.34 0 7.46c0 2.34 1.18 4.41 3.02 5.75V16l2.75-1.5c.7.2 1.45.31 2.23.31 4.42 0 8-3.34 8-7.46S12.42 0 8 0zm1.37 10.36L6.96 7.9 2.8 10.36l4.52-4.8 2.41 2.46 4.16-2.46-4.52 4.8z" />
    </svg>
  </a>

  <script src="script.js"></script>
</body>

</html>
